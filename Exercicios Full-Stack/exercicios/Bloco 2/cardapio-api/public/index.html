
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cardápio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            padding: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
        }

        a {
            text-decoration: none;
            background: #333;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
        }

        .filtro {
            margin-bottom: 30px;
        }

        .filtro label {
            font-weight: bold;
            margin-right: 10px;
        }

        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            min-width: 200px;
        }

        #listaPratos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .descricao {
            color: #666;
            margin-bottom: 15px;
        }

        .categoria {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .preco {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            color: white;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .disponivel {
            background: green;
        }

        .indisponivel {
            background: red;
        }

        .remover {
            display: block;
            width: 100%;
            border: none;
            background: #d32f2f;
            color: white;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .remover:hover {
            background: #b71c1c;
        }

        .mensagem {
            text-align: center;
            margin-top: 30px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>🍽️ Cardápio</h1>

        <a href="/cadastro.html">
            Cadastrar prato
        </a>
    </header>

    <div class="filtro">

        <label for="categoria">
            Filtrar por categoria:
        </label>

        <select id="categoria">
            <option value="">Todas as categorias</option>
        </select>

    </div>

    <main id="listaPratos"></main>

    <p id="mensagem" class="mensagem"></p>

    <script src="/js/lista.js"></script>

</body>

</html>
