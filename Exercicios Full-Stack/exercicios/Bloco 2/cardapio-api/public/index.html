<!DOCTYPE html>
<html lang="en"><!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Prato — Cardápio</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 20px auto; padding: 0 10px; }
    .campo { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, textarea, select { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background: #28a745; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; font-size: 16px; }
    button:hover { background: #218838; }
    #mensagem { margin-top: 15px; padding: 10px; display: none; border-radius: 4px; }
    .sucesso { background: #d4edda; color: #155724; }
    .erro { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

  <h2>Novo Prato</h2>

  <!-- Formulário de cadastro -->
  <form id="formPrato">
    <div class="campo">
      <label for="nome">Nome do Prato *</label>
      <input type="text" id="nome" required placeholder="Ex: Lasanha">
    </div>

    <div class="campo">
      <label for="descricao">Descrição</label>
      <textarea id="descricao" placeholder="Ex: Molho bolonhesa e queijo"></textarea>
    </div>

    <div class="campo">
      <label for="preco">Preço (R$) *</label>
      <input type="number" id="preco" step="0.01" required placeholder="Ex: 45.90">
    </div>

    <div class="campo">
      <label for="categoria">Categoria *</label>
      <select id="categoria" required>
        <option value="1">Entrada</option>
        <option value="2">Pratos Principais</option>
        <option value="3">Sobremesas</option>
        <option value="4">Bebidas</option>
      </select>
    </div>

    <div class="campo">
      <label for="disponivel">Disponível no Cardápio?</label>
      <select id="disponivel">
        <option value="true">Sim</option>
        <option value="false">Não</option>
      </select>
    </div>

    <button type="submit">Cadastrar no Banco</button>
  </form>

    <script src="./js/lista.js"></script>

</body>
</html>
