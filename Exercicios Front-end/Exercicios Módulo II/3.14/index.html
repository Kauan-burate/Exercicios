<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .retangulo{
            width: 1000px;
            height: 700px;
            background-color:#009B3A ;
            position: relative;


        }
        .losangulo{
            position: absolute;
            width: 400px;
            height: 400px;
            background-color: #FFDF00;
            transform: translate(-50%, -50%) rotate(45deg);
            left: 500px;
            top: 355px;
            position: relative;
            
        }
        .circulo{
            position: absolute;
            background-color: #002776;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            left: 65px;
            right: 65px;
            top: 65px;
            bottom: 65px;

        }



    </style>
</head>
<body>
    <div class="retangulo">
        <div class="losangulo"> 
            <div class="circulo">

            </div>
        </div>
    </div>




    
</body>
</html>
