<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>CSS Propriedades</title>
  <style>
    body {
      background-color: cornflowerblue;
      color: white;
      font-size: 18px;
    }
    .color{
        color:coral;
    }
    .font1{
        font-size: 2rem;
    }
    .font2{
        font-weight: 900;
    }
    .font3{
        font-family: 'Caveat', cursive;
        font-weight: 400;
    }
    p{
        text-align: left;
    }
    

    
  </style>
</head>

<body>
  <h1>Important CSS Properties</h1>
  <p class="color">Color</p>
  <p class="font1">Font Size</p>
  <p class="font2">Font Weight</p>
  <p class="font3">Font Family</p>
  <p class="text">Text Align</p>

</html>
